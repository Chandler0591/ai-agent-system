<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI知识库系统</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'default' });</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }
        
        /* 侧边栏 */
        .sidebar {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #333;
        }
        
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-area input {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .file-list {
            margin-top: 20px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }
        
        .file-item {
            background: #f5f5f5;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-progress {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        
        .file-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        
        .file-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 8px;
        }
        
        .status-success { background: #4caf50; }
        .status-processing { background: #ff9800; animation: pulse 1s infinite; }
        .status-error { background: #f44336; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .stats {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        
        .stats-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .stats-label { color: #666; }
        .stats-value { font-weight: 600; color: #667eea; }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .refresh-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 3px 10px;
            cursor: pointer;
            font-size: 12px;
            color: #666;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }
        
        .file-item-delete {
            background: none;
            border: none;
            cursor: pointer;
            color: #ccc;
            font-size: 14px;
            padding: 2px 6px;
            transition: color 0.2s;
        }
        .file-item-delete:hover {
            color: #f44336;
        }
        
        .file-item-chunks {
            font-size: 11px;
            color: #999;
            margin-right: 8px;
            white-space: nowrap;
        }
        
        .clear-all-btn {
            width: 100%;
            margin-top: 8px;
            padding: 10px 0;
            background: #fff;
            border: 1px solid #ffcdd2;
            border-radius: 10px;
            color: #c62828;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .clear-all-btn:hover {
            background: #ffebee;
            border-color: #ef9a9a;
        }
        
        .file-list-empty {
            color: #ccc;
            text-align: center;
            padding: 24px 12px;
            font-size: 13px;
        }
        
        /* 聊天区域 */
        .chat-area {
            background: white;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scene-selector { display: flex; gap: 6px; align-items: center; }
        .scene-btn {
            padding: 4px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
            cursor: pointer; font-size: 12px; transition: all 0.2s;
        }
        .scene-btn:hover { background: rgba(255,255,255,0.25); }
        .scene-btn.active { background: rgba(255,255,255,0.35); color: #fff; border-color: #fff; }
        
        .clear-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        
        .clear-btn:hover {
            background: rgba(255,255,255,0.35);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        
        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102,126,234,0.1);
        }
        
        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .send-btn:hover {
            transform: scale(1.02);
        }

        .image-btn {
            background: #f0f0f0; color: #555; border: 1px solid #ddd;
            padding: 0 12px; border-radius: 24px; cursor: pointer; font-size: 18px;
            transition: all 0.2s; white-space: nowrap;
        }
        .image-btn:hover { background: #e8e8ff; border-color: #667eea; }
        .image-btn.has-image { background: #667eea; color: white; border-color: #667eea; }
        .image-preview { display: none; padding: 8px 20px 0 20px; }
        .image-preview.show { display: flex; align-items: center; gap: 8px; }
        .image-preview img { max-height: 60px; border-radius: 8px; border: 1px solid #ddd; }
        .image-preview .remove-img {
            background: #f44336; color: white; border: none; border-radius: 50%;
            width: 20px; height: 20px; font-size: 12px; cursor: pointer; text-align: center;
        }
        .msg-image { max-width: 200px; max-height: 200px; border-radius: 8px; margin-bottom: 6px; display: block; }

        .bookmarks-panel { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .bookmark-item {
            background: #fff; border: 1px solid #eee; border-radius: 8px;
            padding: 8px 10px; margin-bottom: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s;
        }
        .bookmark-item:hover { background: #f8f9ff; border-color: #667eea; }
        .bookmark-question { font-weight: 600; color: #333; margin-bottom: 2px; }
        .bookmark-answer { color: #666; max-height: 40px; overflow: hidden; }
        .bookmark-tag { color: #999; font-size: 10px; }
        .bookmark-delete {
            background: none; border: none; color: #ccc; cursor: pointer;
            font-size: 14px; padding: 0 4px; float: right;
        }
        .bookmark-delete:hover { color: #f44336; }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <h2>📄 知识库管理</h2>
            
            <!-- 登录区域 -->
            <div id="loginSection" style="margin-bottom:12px;">
                <div class="section-header"><span>🔐 登录</span></div>
                <input id="loginUser" type="text" placeholder="用户名" style="width:100%;padding:6px;margin-bottom:4px;border-radius:4px;border:1px solid #ddd;font-size:13px;">
                <input id="loginPass" type="password" placeholder="密码" style="width:100%;padding:6px;margin-bottom:4px;border-radius:4px;border:1px solid #ddd;font-size:13px;">
                <select id="tenantSelect" style="width:100%;padding:6px;border-radius:4px;border:1px solid #ddd;margin-bottom:4px;font-size:13px;">
                    <option value="">加载租户...</option>
                </select>
                <button onclick="doLogin()" style="width:100%;padding:6px;background:#667eea;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;">登录</button>
                <div id="loginMsg" style="font-size:12px;margin-top:4px;"></div>
            </div>
            
            <!-- 已登录状态 -->
            <div id="loggedInSection" style="display:none;margin-bottom:12px;">
                <div style="background:#e8f5e9;padding:8px;border-radius:6px;font-size:13px;">
                    ✅ <b id="displayUser">admin</b> @ <b id="displayTenant">default</b>
                    <button onclick="doLogout()" style="float:right;background:none;border:none;color:#c62828;cursor:pointer;">登出</button>
                </div>
            </div>
            
            <!-- 未登录提示 -->
            <div id="noLoginHint" style="background:#fff3cd;padding:8px;border-radius:6px;font-size:12px;margin-bottom:12px;color:#856404;">
                ⚠️ 未登录，所有操作归 <b>default</b> 租户（上方选租户后需点登录才生效）
            </div>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div>点击或拖拽上传PDF</div>
                <input type="file" id="fileInput" accept=".pdf" multiple>
            </div>
            
            <div class="section-header">
                <span>📋 已上传文档</span>
                <button class="refresh-btn" onclick="loadKbDocuments()">🔄 刷新</button>
            </div>
            <div class="file-list" id="fileList">
                <div style="color: #999; text-align: center; padding: 20px;">加载中...</div>
            </div>
            
            <div class="stats">
                <div class="stats-item">
                    <span class="stats-label">📚 文档数量</span>
                    <span class="stats-value" id="docCount">0</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">📊 状态</span>
                    <span class="stats-value" id="systemStatus">运行中</span>
                </div>
            </div>
            <button class="clear-all-btn" onclick="clearKnowledgeBase()">🗑️ 清空知识库</button>

            <div class="section-header">
                <span>⭐ 我的收藏</span>
                <button class="refresh-btn" onclick="loadBookmarks()">🔄 刷新</button>
            </div>
            <div class="bookmarks-panel" id="bookmarksPanel">
                <div class="file-list-empty">暂无收藏</div>
            </div>
        </div>
        
        <!-- 聊天区域 -->
        <div class="chat-area">
            <div class="chat-header">
                <span>🤖 AI知识库助手</span>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div class="scene-selector" id="sceneSelector">
                        <button class="scene-btn" data-scene="precise" title="精准回答：基于事实，减少推测">🎯 精准</button>
                        <button class="scene-btn active" data-scene="balanced" title="平衡回答：准确性与友好性兼得">⚖️ 平衡</button>
                        <button class="scene-btn" data-scene="creative" title="创意发挥：多角度思考，适度发散">🎨 创意</button>
                    </div>
                    <button class="clear-btn" onclick="clearChat()">🗑️ 清空</button>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-content">
                        你好！我是AI知识库助手。<br>
                        你可以：<br>
                        • 上传PDF文档建立知识库<br>
                        • 问我关于文档内容的问题<br>
                        • 使用工具查询天气、做计算
                    </div>
                </div>
            </div>
            
            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="" alt="预览">
                <button class="remove-img" onclick="clearImage()">✕</button>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="输入你的问题...">
                <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
                <button class="image-btn" id="imageBtn" onclick="document.getElementById('imageInput').click()" title="上传图片">🖼️</button>
                <button class="send-btn" id="sendBtn">发送</button>
            </div>
        </div>
    </div>
    
    <script>
        // 配置
        const API_BASE = 'http://localhost:8000/api';
        
        // 会话ID —— 整个页面生命周期内保持不变，保证多轮对话记忆
        let sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        
        // DOM元素
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileList = document.getElementById('fileList');
        const docCountSpan = document.getElementById('docCount');
        
        // 已上传文件列表
        let uploadedFiles = [];
        
        // 租户状态
        let currentTenant = 'default';
        let authToken = '';
        let currentUser = '';
        let lastAnswerText = '';  // 保存最新回答用于导出
        
        function getAuthHeaders() {
            return authToken ? { 'Authorization': `Bearer ${authToken}` } : {};
        }

        // ---- 渲染: Mermaid + 代码高亮 ----
        function renderMarkdown(el, text) {
            if (text.includes('```mermaid')) {
                text = text.replace(/```mermaid\n([\s\S]*?)```/g, (_, code) => {
                    const id = 'mermaid-' + Math.random().toString(36).slice(2, 8);
                    setTimeout(() => {
                        try { mermaid.render(id + '-svg', code).then(({svg}) => {
                            const el = document.getElementById(id);
                            if (el) el.innerHTML = svg;
                        }); } catch(e) {}
                    }, 100);
                    return `<div id="${id}" class="mermaid-container"></div>`;
                });
            }
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                try {
                    const highlighted = lang && hljs.getLanguage(lang)
                        ? hljs.highlight(code, { language: lang }).value : hljs.highlightAuto(code).value;
                    return `<pre><code class="hljs language-${lang}">${highlighted}</code></pre>`;
                } catch(e) { return `<pre><code>${code}</code></pre>`; }
            });
            text = text.replace(/\|(.+)\|\n\|[-: |]+\|\n((?:\|.+\|\n?)*)/g, (match) => {
                const rows = match.trim().split('\n').filter(r => r.includes('|') && !r.includes('---'));
                let html = '<table style="border-collapse:collapse;width:100%;margin:8px 0">';
                rows.forEach((row, i) => {
                    const cells = row.split('|').filter(c => c.trim());
                    const tag = i === 0 ? 'th' : 'td';
                    html += '<tr>' + cells.map(c => `<${tag} style="border:1px solid #ddd;padding:6px">${c.trim()}</${tag}>`).join('') + '</tr>';
                });
                return html + '</table>';
            });
            text = text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
            text = text.replace(/\n/g, '<br>');
            el.innerHTML = text;
        }

        function addActionButtons(el, text) {
            const btnGroup = document.createElement('div');
            btnGroup.style.cssText = 'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap';

            const starBtn = document.createElement('button');
            starBtn.innerText = '☆ 收藏';
            starBtn.style.cssText = 'padding:2px 8px;font-size:11px;border:1px solid #ffc107;border-radius:4px;cursor:pointer;background:#fffbe6';
            starBtn.onclick = async () => {
                starBtn.innerText = '⏳';
                try {
                    await fetch(`${API_BASE}/bookmark/toggle`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
                        body: JSON.stringify({ session_id: sessionId, question: text.split('\n')[0].substring(0, 100), answer: text, tag: '' })
                    });
                    loadBookmarks();
                } catch(e) {}
                starBtn.innerText = '☆ 收藏';
            };
            btnGroup.appendChild(starBtn);

            const copyBtn = document.createElement('button');
            copyBtn.innerText = '📋 复制';
            copyBtn.style.cssText = 'padding:2px 8px;font-size:11px;border:1px solid #ddd;border-radius:4px;cursor:pointer;background:#fff';
            copyBtn.onclick = () => { navigator.clipboard.writeText(text.replace(/<[^>]+>/g,'').replace(/<br>/g,'\n')); copyBtn.innerText = '✅ 已复制'; setTimeout(() => copyBtn.innerText = '📋 复制', 2000); };
            btnGroup.appendChild(copyBtn);

            const wordBtn = document.createElement('button');
            wordBtn.innerText = '📄 Word';
            wordBtn.style.cssText = 'padding:2px 8px;font-size:11px;border:1px solid #ddd;border-radius:4px;cursor:pointer;background:#fff';
            wordBtn.onclick = async () => {
                const resp = await fetch(`${API_BASE}/export?format=docx`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getAuthHeaders() }, body: `text=${encodeURIComponent(lastAnswerText)}` });
                if (resp.ok) { const blob = await resp.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'answer.docx'; a.click(); }
            };
            btnGroup.appendChild(wordBtn);

            if (text.includes('|') && text.includes('---')) {
                const excelBtn = document.createElement('button');
                excelBtn.innerText = '📊 Excel';
                excelBtn.style.cssText = 'padding:2px 8px;font-size:11px;border:1px solid #ddd;border-radius:4px;cursor:pointer;background:#fff';
                excelBtn.onclick = async () => {
                    const resp = await fetch(`${API_BASE}/export?format=xlsx`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getAuthHeaders() }, body: `text=${encodeURIComponent(lastAnswerText)}` });
                    if (resp.ok) { const blob = await resp.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'data.xlsx'; a.click(); }
                };
                btnGroup.appendChild(excelBtn);
            }
            el.appendChild(btnGroup);
        }
        
        async function loadTenants() {
            try {
                const resp = await fetch(`${API_BASE}/tenants`);
                const data = await resp.json();
                const sel = document.getElementById('tenantSelect');
                sel.innerHTML = data.tenants.map(t => 
                    `<option value="${t.tenant_id}">${t.name}</option>`
                ).join('');
            } catch (e) {
                document.getElementById('tenantSelect').innerHTML = '<option>加载失败</option>';
            }
        }
        
        async function doLogin() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();
            const tenantId = document.getElementById('tenantSelect').value;
            const msgEl = document.getElementById('loginMsg');
            if (!username || !tenantId) { msgEl.innerHTML = '<span style="color:red">请填写用户名并选择租户</span>'; return; }
            try {
                const resp = await fetch(`${API_BASE}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&tenant_id=${encodeURIComponent(tenantId)}`
                });
                if (resp.ok) {
                    const data = await resp.json();
                    authToken = data.access_token;
                    currentTenant = tenantId;
                    currentUser = username;
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('loggedInSection').style.display = 'block';
                    document.getElementById('noLoginHint').style.display = 'none';
                    document.getElementById('displayUser').innerText = username;
                    document.getElementById('displayTenant').innerText = tenantId;
                    msgEl.innerHTML = '';
                    await loadKbDocuments();
                    await loadBookmarks();
                    await loadStats();
                } else {
                    const err = await resp.json().catch(() => ({}));
                    msgEl.innerHTML = `<span style="color:red">${err.detail || '登录失败'}</span>`;
                }
            } catch (e) {
                msgEl.innerHTML = '<span style="color:red">网络错误</span>';
            }
        }
        
        function doLogout() {
            if (authToken) {
                fetch(`${API_BASE}/revoke`, { method: 'POST', headers: getAuthHeaders() }).catch(()=>{});
            }
            authToken = '';
            currentTenant = 'default';
            currentUser = '';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('loggedInSection').style.display = 'none';
            document.getElementById('noLoginHint').style.display = 'block';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            // 清空收藏面板
            window._bookmarkedAnswers = new Set();
            document.getElementById('bookmarksPanel').innerHTML = '<div class="file-list-empty">暂无收藏</div>';
            // 清空对话
            chatMessages.innerHTML = '<div class="message assistant"><div class="message-content">已退出登录，请重新登录后开始对话</div></div>';
            sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
            lastAnswerText = '';
            loadStats();
            loadKbDocuments();
        }
        
        // 回车登录
        document.getElementById('loginPass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });
        
        // 选租户自动填账号密码
        const tenantCreds = {
            'default': ['admin', 'admin123'],
            'demo1': ['demo1', 'demo1123'],
            'demo2': ['demo2', 'demo2123'],
        };
        document.getElementById('tenantSelect').addEventListener('change', (e) => {
            const creds = tenantCreds[e.target.value];
            if (creds) {
                document.getElementById('loginUser').value = creds[0];
                document.getElementById('loginPass').value = creds[1];
            }
        });
        
        // 初始化
        async function init() {
            await loadTenants();
            await loadStats();
            await loadKbDocuments();
            await loadBookmarks();
            setupEventListeners();
        }
        
        // 事件监听
        function setupEventListeners() {
            sendBtn.addEventListener('click', sendMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#667eea';
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#ddd';
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                handleFiles(e.dataTransfer.files);
            });
            
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
        }
        
        // 处理文件上传（带进度轮询）
        async function handleFiles(files) {
            for (const file of files) {
                if (file.type !== 'application/pdf') {
                    addMessage('system', `${file.name} 不是PDF文件`);
                    continue;
                }
                
                // 添加到列表（处理中）
                const fileId = addFileToList(file.name, 'processing');
                
                // 上传
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch(`${API_BASE}/rag/upload`, {
                        method: 'POST',
                        body: formData,
                        headers: getAuthHeaders()
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        const taskId = data.task_id;
                        
                        // 轮询任务状态
                        await pollTaskStatus(taskId, fileId, file.name);
                        await loadStats();
                        await loadKbDocuments();
                    } else if (response.status === 409) {
                        updateFileStatus(fileId, 'duplicate');
                        const force = confirm(`${file.name} 已存在，是否强制覆盖？`);
                        if (force) {
                            updateFileStatus(fileId, 'processing');
                            const retryResp = await fetch(`${API_BASE}/rag/upload?force=true`, {
                                method: 'POST',
                                body: formData,
                                headers: getAuthHeaders()
                            });
                            if (retryResp.ok) {
                                const data = await retryResp.json();
                                await pollTaskStatus(data.task_id, fileId, file.name);
                                await loadStats();
                                await loadKbDocuments();
                            } else {
                                updateFileStatus(fileId, 'error');
                            }
                        } else {
                            addMessage('system', `⚠️ ${file.name} 已存在，跳过`);
                            removeFileItem(fileId);
                        }
                    } else {
                        updateFileStatus(fileId, 'error');
                        addMessage('system', `上传失败: ${file.name}`);
                    }
                } catch (error) {
                    updateFileStatus(fileId, 'error');
                    addMessage('system', `上传失败: ${error.message}`);
                }
            }
            fileInput.value = '';
        }
        
        // 轮询任务状态
        async function pollTaskStatus(taskId, fileId, filename) {
            const maxRetries = 90;  // 90 × 2s = 3分钟，大文件需要更长时间
            for (let i = 0; i < maxRetries; i++) {
                await new Promise(r => setTimeout(r, 2000));
                
                try {
                    const resp = await fetch(`${API_BASE}/task/${taskId}`);
                    if (!resp.ok) continue;
                    
                    const task = await resp.json();
                    const progress = Math.min(100, Math.round((i + 1) / maxRetries * 100));
                    updateFileProgress(fileId, progress);
                    
                    if (task.status === 'completed' || task.status === 'success') {
                        const chunks = task.result?.chunks || task.result?.added || 0;
                        updateFileStatus(fileId, 'success', chunks);
                        addMessage('system', `✅ ${filename} 处理完成 (${chunks}个文档块)`);
                        return;
                    } else if (task.status === 'error' || task.status === 'failed') {
                        const errMsg = task.error || task.result?.message || '';
                        updateFileStatus(fileId, 'error');
                        addMessage('system', `❌ ${filename} 处理失败${errMsg ? ': ' + errMsg : ''}`);
                        return;
                    }
                } catch (e) {
                    // 继续重试
                }
            }
            updateFileStatus(fileId, 'error');
            addMessage('system', `⏰ ${filename} 处理超时（文件过大，请稍后刷新查看）`);
        }
        
        // 添加到文件列表
        function addFileToList(filename, status) {
            const fileId = `file-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.id = fileId;
            fileItem.innerHTML = `
                <span class="file-name">${filename}</span>
                <div class="file-status status-${status}"></div>
            `;
            
            // 移除空状态提示
            if (fileList.children.length === 1 && fileList.children[0].innerText.includes('暂无')) {
                fileList.innerHTML = '';
            }
            fileList.appendChild(fileItem);
            
            uploadedFiles.push({ id: fileId, name: filename, status });
            return fileId;
        }
        
        // 更新文件状态
        function updateFileStatus(fileId, status, chunks = null) {
            const element = document.getElementById(fileId);
            if (element) {
                const statusDiv = element.querySelector('.file-status');
                statusDiv.className = `file-status status-${status}`;
                if (chunks !== null) {
                    const nameSpan = element.querySelector('.file-name');
                    const origName = nameSpan.textContent.split('(')[0].trim();
                    nameSpan.innerHTML = `${origName} (${chunks}块)`;
                }
                // 移除进度条
                const progressBar = element.querySelector('.file-progress');
                if (progressBar && (status === 'success' || status === 'error')) {
                    progressBar.remove();
                }
            }
        }
        
        // 更新文件进度条
        function updateFileProgress(fileId, percent) {
            const element = document.getElementById(fileId);
            if (!element) return;
            let progressDiv = element.querySelector('.file-progress');
            if (!progressDiv) {
                progressDiv = document.createElement('div');
                progressDiv.className = 'file-progress';
                progressDiv.innerHTML = '<div class="file-progress-bar" style="width:0%"></div>';
                element.appendChild(progressDiv);
            }
            const bar = progressDiv.querySelector('.file-progress-bar');
            if (bar) bar.style.width = `${percent}%`;
        }
        
        // 发送消息（SSE 流式）
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            if (!authToken) {
                addMessage('system', '⚠️ 请先在左侧登录后再发送消息');
                document.getElementById('loginUser').focus();
                return;
            }

            addMessage('user', message, currentImageBase64 ? document.getElementById('previewImg').src : null);
            chatInput.value = '';

            const imagePayload = currentImageBase64;
            clearImage();

            const requestBody = { message, mode: 'auto', session_id: sessionId, scene: currentScene };
            if (imagePayload) { requestBody.image = imagePayload; }

            const streamId = createStreamingMessage();
            let fullText = '';

            try {
                const response = await fetch(`${API_BASE}/agent/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    updateStreamingMessage(streamId, `抱歉，出错了: ${response.status}`);
                    finalizeStreamingMessage(streamId, fullText);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const event = JSON.parse(line.slice(6));
                                handleStreamEvent(event, streamId, (token) => { fullText += token; });
                            } catch (e) {}
                        }
                    }
                }
                finalizeStreamingMessage(streamId, fullText);
            } catch (error) {
                updateStreamingMessage(streamId, `抱歉，网络错误: ${error.message}`);
                finalizeStreamingMessage(streamId, fullText);
            }
        }
        
        // 处理 SSE 事件
        function handleStreamEvent(event, streamId, onToken) {
            switch (event.type) {
                case 'intent':
                    // 忽略，仅用于日志
                    break;
                case 'info':
                    updateStreamingMessage(streamId, event.data + '\n', true);
                    break;
                case 'token':
                    onToken(event.data);
                    appendToStreamingMessage(streamId, event.data);
                    break;
                case 'sources':
                    if (event.data && event.data.length > 0) {
                        addSourcesMessage(event.data);
                    }
                    break;
                case 'error':
                    appendToStreamingMessage(streamId, `\n❌ ${event.data}`);
                    break;
                // 'done' 不需要处理
            }
        }
        
        // 创建流式消息容器
        function createStreamingMessage() {
            const id = 'stream-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = id;
            messageDiv.innerHTML = `<div class="message-content">▊</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
        
        // 追加 token 到流式消息
        function appendToStreamingMessage(id, token) {
            const element = document.getElementById(id);
            if (!element) return;
            const content = element.querySelector('.message-content');
            if (content) {
                // 用 token 逐个追加
                const text = content.textContent;
                if (text === '▊' || text.endsWith('▊')) {
                    content.innerHTML = formatContent(text.replace('▊', '') + token) + '▊';
                } else {
                    content.innerHTML = formatContent(text.slice(0, -1)) + token + '▊';
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
        
        // 更新流式消息（替换内容）
        function updateStreamingMessage(id, text, append = false) {
            const element = document.getElementById(id);
            if (!element) return;
            const content = element.querySelector('.message-content');
            if (content) {
                if (append) {
                    const current = content.textContent.replace('▊', '');
                    content.innerHTML = formatContent(current + text) + '▊';
                } else {
                    content.innerHTML = formatContent(text) + '▊';
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
        
        // 完成流式消息（移除光标 + 渲染 + 加按钮）
        function finalizeStreamingMessage(id, fullTextParam) {
            const element = document.getElementById(id);
            if (!element) return;
            const content = element.querySelector('.message-content');
            if (content) {
                lastAnswerText = fullTextParam || '';
                renderMarkdown(content, fullTextParam || '');
                addActionButtons(content, fullTextParam || '');
            }
        }

        // 添加消息
        function addMessage(role, content, imageUrl = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            const inner = document.createElement('div');
            inner.className = 'message-content';
            let displayContent = content;
            if (imageUrl && role === 'user') {
                displayContent = `<img src="${imageUrl}" class="msg-image">${content}`;
            }
            if (role === 'assistant') {
                lastAnswerText = content;
                renderMarkdown(inner, content);
                addActionButtons(inner, content);
            } else {
                inner.innerHTML = formatContent(displayContent);
            }
            messageDiv.appendChild(inner);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 添加来源消息
        function addSourcesMessage(sources) {
            const sourcesHtml = sources.map(s => 
                `📖 [${s.relevance}] ${s.source}<br><small>${s.text.substring(0, 100)}...</small>`
            ).join('<br><br>');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message assistant`;
            messageDiv.innerHTML = `<div class="message-content" style="font-size: 12px; background: #e8e8ff;"><strong>📚 参考来源:</strong><br>${sourcesHtml}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 添加加载消息
        function addLoadingMessage() {
            const id = 'loading-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = id;
            messageDiv.innerHTML = `<div class="message-content"><div class="loading"></div> 思考中...</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
        
        // 移除加载消息
        function removeLoadingMessage(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }
        
        // 格式化内容
        function formatContent(content) {
            return content.replace(/\n/g, '<br>');
        }
        
        // 加载统计
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`, { headers: getAuthHeaders() });
                if (response.ok) {
                    const data = await response.json();
                    docCountSpan.textContent = data.knowledge_base?.document_count || 0;
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        // 加载知识库文档列表
        async function loadKbDocuments() {
            try {
                const resp = await fetch(`${API_BASE}/kb/documents`, { headers: getAuthHeaders() });
                if (!resp.ok) return;
                const data = await resp.json();
                renderKbDocumentList(data.documents || []);
            } catch (e) {
                console.error('加载文档列表失败:', e);
            }
        }
        
        // 渲染文档列表
        function renderKbDocumentList(documents) {
            fileList.innerHTML = '';
            if (documents.length === 0) {
                fileList.innerHTML = '<div class="file-list-empty">暂无文档</div>';
                return;
            }
            documents.forEach(doc => {
                const div = document.createElement('div');
                div.className = 'file-item';
                // 截断过长的文件名
                const displayName = doc.source.length > 28 
                    ? doc.source.substring(0, 26) + '...' 
                    : doc.source;
                div.innerHTML = `
                    <span class="file-name" title="${doc.source}">${displayName}</span>
                    <span class="file-item-chunks">${doc.chunks}块</span>
                    <button class="file-item-delete" data-source="${doc.source.replace(/"/g, '&quot;')}" onclick="deleteKbDocument(this.dataset.source)" title="删除">✕</button>
                `;
                fileList.appendChild(div);
            });
        }
        
        // 删除单个文档
        async function deleteKbDocument(source) {
            if (!confirm(`⚠️ 不可恢复！\n\n确定要永久删除文档 "${source}" 吗？\n该操作无法撤销。`)) return;
            try {
                const resp = await fetch(`${API_BASE}/kb/documents/${encodeURIComponent(source)}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if (resp.ok) {
                    addMessage('system', `🗑️ 已删除: ${source}`);
                    await loadKbDocuments();
                    await loadStats();
                } else {
                    const err = await resp.json();
                    addMessage('system', `删除失败: ${err.detail || resp.status}`);
                }
            } catch (e) {
                addMessage('system', `删除失败: ${e.message}`);
            }
        }
        
        // 清空知识库
        async function clearKnowledgeBase() {
            if (!confirm('⚠️ 不可恢复！\n\n确定要清空整个知识库吗？\n所有文档将被永久删除，此操作无法撤销！')) return;
            try {
                const resp = await fetch(`${API_BASE}/rag/clear`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if (resp.ok) {
                    addMessage('system', '🗑️ 知识库已清空');
                    await loadKbDocuments();
                    await loadStats();
                }
            } catch (e) {
                addMessage('system', `清空失败: ${e.message}`);
            }
        }
        
        // 移除文件项（重复时使用）
        function removeFileItem(fileId) {
            const el = document.getElementById(fileId);
            if (el) el.remove();
        }

        // ---- 图片上传 ----
        let currentImageBase64 = null;
        let currentImageMime = 'image/png';
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { alert('请选择图片文件'); return; }
            currentImageMime = file.type;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageBase64 = e.target.result.split(',')[1];
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('imagePreview').classList.add('show');
                document.getElementById('imageBtn').classList.add('has-image');
                document.getElementById('imageBtn').textContent = '🖼️✓';
            };
            reader.readAsDataURL(file);
        }
        function clearImage() {
            currentImageBase64 = null;
            document.getElementById('imagePreview').classList.remove('show');
            document.getElementById('imageBtn').classList.remove('has-image');
            document.getElementById('imageBtn').textContent = '🖼️';
            document.getElementById('imageInput').value = '';
        }

        // ---- 场景切换 ----
        let currentScene = 'balanced';
        document.getElementById('sceneSelector').addEventListener('click', (e) => {
            if (e.target.classList.contains('scene-btn')) {
                document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentScene = e.target.dataset.scene;
            }
        });

        // ---- 收藏 ----
        async function deleteBookmark(id) {
            try {
                await fetch(`${API_BASE}/bookmark/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                loadBookmarks();
            } catch(e) {}
        }

        async function loadBookmarks() {
            try {
                const resp = await fetch(`${API_BASE}/bookmarks?limit=50`, { headers: getAuthHeaders() });
                if (!resp.ok) return;
                const data = await resp.json();
                window._bookmarkedAnswers = new Set((data.bookmarks || []).map(b => b.answer));
                const panel = document.getElementById('bookmarksPanel');
                if (!data.bookmarks || data.bookmarks.length === 0) {
                    panel.innerHTML = '<div class="file-list-empty">暂无收藏</div>';
                    return;
                }
                panel.innerHTML = data.bookmarks.map(b =>
                    `<div class="bookmark-item" onclick="document.getElementById('chatInput').value='${b.question.replace(/'/g, "\\'").replace(/"/g, '&quot;')}'; document.getElementById('chatInput').focus()">
                        <button class="bookmark-delete" onclick="event.stopPropagation();deleteBookmark(${b.id})" title="取消收藏">✕</button>
                        <div class="bookmark-question">${b.question.substring(0, 60)}</div>
                        <div class="bookmark-answer">${b.answer.substring(0, 80)}</div>
                        <div class="bookmark-tag">${b.created_at?.substring(0, 10) || ''}</div>
                    </div>`).join('');
            } catch(e) {}
        }

        // 自动刷新统计 + 文档列表
        setInterval(loadStats, 10000);
        setInterval(loadKbDocuments, 15000);
        
        // 清空对话
        function clearChat() {
            if (confirm('确定要清空所有对话记录吗？（不影响知识库数据）')) {
                chatMessages.innerHTML = `
                    <div class="message assistant">
                        <div class="message-content">
                            对话已清空，有什么可以帮你的？
                        </div>
                    </div>`;
                // 重置会话ID，开启全新对话
                sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
            }
        }
        
        // 启动
        init();
    </script>
</body>
</html>
